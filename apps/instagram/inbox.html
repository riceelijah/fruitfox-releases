<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/_kit/kit.css"><link rel="stylesheet" href="ig.css"><script src="ig.js"></script>
<div class="sbar"><input class="sbox" id="q" type="search" placeholder="Search" autocomplete="off"></div>
<main id="list" class="list"><div class="spinner"></div></main>
<script>
// Messages: your conversations, newest first; unread ones in bold.
const row = t => {
  const others = (t.users || []).filter(u => u.id !== t.viewer_id), last = t.slide_messages?.edges?.[0]?.node;
  const unread = t.marked_as_unread || (last && last.sender_fbid !== t.viewer?.interop_messaging_user_fbid
    && !(t.slide_read_receipts || []).some(r => r.participant_fbid === t.viewer?.interop_messaging_user_fbid && +r.watermark_timestamp_ms >= +last.timestamp_ms));
  return `<div class="cell row tappable" data-thread="${esc(t.thread_fbid)}" data-title="${esc(t.thread_title)}">
    <img alt="" class="avatar" style="width:56px;height:56px" src="${esc(pic(others[0]))}">
    <div class="grow"><div class="ellipsis ${unread ? 'headline' : ''}">${esc(t.thread_title || others.map(u => u.username).join(', '))}</div>
      <div class="small ellipsis ${unread ? '' : 'secondary'}">${esc(last?.text_body || last?.igd_snippet || '')} · ${last ? ago(last.timestamp_ms / 1000) : ''}</div></div>
    ${unread ? '<span class="unread-dot"></span>' : ''}</div>`;
};
let threads = [];
const name = t => (t.thread_title || (t.users || []).map(u => u.username).join(', ') + ' ' + (t.users || []).map(u => u.full_name || '').join(' ')).toLowerCase();
function show() {
  const q = $('#q').value.trim().toLowerCase(), shown = threads.filter(t => !q || name(t).includes(q));
  $('#list').innerHTML = shown.map(row).join('') || `<div class="center secondary">${q ? 'No results' : 'No messages'}</div>`;
}
async function load() {
  await guard($('#list'), async () => {
    const box = await ig.inbox();
    threads = (box?.threads_by_folder?.edges || []).map(e => e.node.as_ig_direct_thread).filter(Boolean);
    show();
  });
}
$('#q').oninput = show;
$('#list').addEventListener('click', e => { const t = e.target.closest('[data-thread]'); if (t) fruitfox.ui.push('thread.html?id=' + t.dataset.thread, t.dataset.title); });
fruitfox.on('refresh', load);
load();
</script>
