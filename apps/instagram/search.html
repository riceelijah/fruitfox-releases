<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/_kit/kit.css"><link rel="stylesheet" href="ig.css"><script src="ig.js"></script>
<div class="pad" style="position:sticky;top:0;background:var(--bg);z-index:1"><input class="field" id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search"></div>
<main id="results" class="list" hidden></main>
<div class="grid" id="explore"><div class="spinner" style="grid-column:1/-1"></div></div>
<script>
// Search accounts and hashtags (Return searches posts for the words); Explore underneath while the box is empty.
let timer, next = null, items = [];
async function page(maxId) {
  const r = await ig.explore(maxId);
  next = r.more_available ? r.next_max_id : null;
  const found = findMedia(r.sectional_items || r);
  items = maxId ? items.concat(found) : found;
  return found.map(tile).join('');
}
const loadExplore = () => guard($('#explore'), async () => { $('#explore').innerHTML = await page(); });
$('#q').oninput = () => {
  clearTimeout(timer);
  const q = $('#q').value.trim();
  $('#results').hidden = !q; $('#explore').hidden = !!q;
  if (!q) return $('#results').innerHTML = '';
  timer = setTimeout(() => guard($('#results'), async () => {
    const r = await ig.search(q);
    if ($('#q').value.trim() !== q) return;
    const tags = (r.hashtags || []).map(h => h.hashtag).slice(0, 4).map(h => `<div class="cell row tappable" data-tag="${esc(h.name)}">
      <div class="avatar" style="display:grid;place-items:center;font-size:20px">#</div><div class="grow"><div class="headline">#${esc(h.name)}</div>
      <div class="small secondary">${count(h.media_count)} posts</div></div></div>`).join('');
    const users = (r.users || []).map(({ user: u }) => `<div class="cell row tappable" data-user="${esc(u.username)}" data-uid="${esc(u.pk || u.pk_id)}">
      <img alt="" class="avatar" src="${esc(pic(u))}"><div class="grow"><div class="headline ellipsis">${esc(u.username)}${verified(u)}</div>
      <div class="small secondary ellipsis">${esc(u.full_name)}</div></div></div>`).join('');
    $('#results').innerHTML = users + tags || '<div class="center secondary">No results</div>';
  }), 400);  // waits for a pause in typing: fewer requests
};
$('#q').onkeydown = e => { if (e.key === 'Enter' && $('#q').value.trim()) { $('#q').blur(); fruitfox.ui.push('tag.html?q=' + encodeURIComponent($('#q').value.trim()), $('#q').value.trim()); } };
$('#results').addEventListener('click', openLink);
$('#explore').addEventListener('click', e => openFeed(e, items, 'explore', next, 'Explore'));
onNearEnd(async () => { if (next && $('#q').value.trim() === '') $('#explore').insertAdjacentHTML('beforeend', await page(next)); });
fruitfox.on('refresh', loadExplore);
loadExplore();
</script>
