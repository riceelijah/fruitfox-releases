<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/_kit/kit.css"><link rel="stylesheet" href="ig.css"><script src="ig.js"></script>
<div class="grid" id="grid"><div class="spinner" style="grid-column:1/-1"></div></div>
<script>
// A hashtag or keyword (?q=#cats): Instagram's top results.
const q = fruitfox.params.q;
let items = [], next = null;
async function page(after) {
  const r = await ig.keyword(q, after);
  next = r.next;
  items = after ? items.concat(r.items) : r.items;
  return r.items.map(tile).join('') || (after ? '' : '<div class="center secondary" style="grid-column:1/-1">No posts</div>');
}
guard($('#grid'), async () => { $('#grid').innerHTML = await page(); });
$('#grid').addEventListener('click', e => openFeed(e, items, { tag: q }, next, q));
onNearEnd(async () => { if (next) $('#grid').insertAdjacentHTML('beforeend', await page(next)); });
</script>
