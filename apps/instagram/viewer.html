<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"><link rel="stylesheet" href="/_kit/kit.css"><link rel="stylesheet" href="ig.css"><script src="ig.js"></script>
<style>
  html, body { background: #000; height: 100%; margin: 0; overflow: hidden; }
  #pages { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; transition: transform .25s, opacity .25s; }
  #pages > div { flex: none; width: 100%; height: 100%; scroll-snap-align: center; overflow: auto; display: grid; place-items: center; }
  #pages img, #pages video { max-width: 100%; max-height: 100%; }
  #close { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: rgb(0 0 0 / .45); color: #fff; font-size: 18px; -webkit-backdrop-filter: blur(20px); }
  #count { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 12px); left: 0; right: 0; text-align: center; color: #fff9; }
</style>
<div id="pages"></div><button id="close" aria-label="Close">✕</button><div id="count" class="small"></div>
<script>
// Full screen: swipe between photos, pinch to zoom, swipe down (at normal size) or ✕ to close.
fruitfox.storage.get('viewer').then(v => {
  $('#pages').innerHTML = v.items.map(x => `<div>${x.video ? `<video playsinline controls autoplay src="${esc(x.video)}" poster="${esc(x.img)}"></video>` : `<img alt="" src="${esc(x.img)}">`}</div>`).join('');
  $('#pages').scrollLeft = innerWidth * v.i;
  const n = () => $('#count').textContent = v.items.length > 1 ? `${Math.round($('#pages').scrollLeft / innerWidth) + 1} of ${v.items.length}` : '';
  n(); $('#pages').onscroll = n;
});
$('#close').onclick = () => fruitfox.ui.back();
let y0 = null;
addEventListener('touchstart', e => { y0 = e.touches.length === 1 && visualViewport.scale <= 1.01 ? e.touches[0].clientY : null; });
addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); $('#pages').style.transition = 'none'; $('#pages').style.transform = `translateY(${dy}px)`; $('#pages').style.opacity = 1 - dy / 600; });
addEventListener('touchend', e => {
  if (y0 == null) return;
  const dy = e.changedTouches[0].clientY - y0; y0 = null;
  $('#pages').style.transition = ''; $('#pages').style.transform = ''; $('#pages').style.opacity = '';
  if (dy > 120) fruitfox.ui.back();
});
</script>
