<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/_kit/kit.css"><link rel="stylesheet" href="th.css"><script src="th.js"></script>
<main id="list"><div class="spinner"></div></main>
<script>
// Home: the newest threads from people you follow here, merged.
async function load() {
  await settings();
  const fs = await follows();
  if (!fs.length) { $('#list').innerHTML = '<div class="center"><div class="headline">Follow people to fill Home</div><div class="secondary">Search for someone and tap Follow. They’re kept on this phone; no account needed.</div></div>'; return; }
  try {
    const all = (await Promise.all(fs.map(f => userPosts(f.pk).then(r => r.threads.slice(0, +S.perPerson)).catch(() => [])))).flat();
    const shown = all.filter(c => S.replies || !c[0].text_post_app_info?.is_reply).sort((a, b) => b.at(-1).taken_at - a.at(-1).taken_at);
    $('#list').innerHTML = shown.map(threadHTML).join('') || '<div class="center secondary">No posts yet.</div>';
  } catch (e) { $('#list').innerHTML = errorHTML(e); }
}
wirePosts($('#list'));
fruitfox.ui.buttons(BUTTONS);
fruitfox.on('refresh', load);
load();
</script>
